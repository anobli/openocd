# SPDX-License-Identifier: GPL-2.0-or-later

# Build upstream OpenOCD (openocd-org/openocd master) for Linux every week.
# Each build is published as a permanent release named after its version
# and as the rolling "weekly" pre-release of this repository.
#
# Scheduled workflows only run from the repository's default branch.

name: OpenOCD Linux weekly

on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream branch, tag or commit SHA to build'
        default: master
        type: string
      force:
        description: 'Rebuild even if upstream did not change'
        default: false
        type: boolean

permissions:
  contents: write   # create/replace the release
  actions: write    # keep the schedule from being auto-disabled

concurrency:
  group: linux-weekly
  cancel-in-progress: false

env:
  UPSTREAM: openocd-org/openocd
  RELEASE_TAG: weekly

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Resolve upstream revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'master' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$REF
          else
            sha=$(git ls-remote "https://github.com/$UPSTREAM.git" \
                    "refs/heads/$REF" "refs/tags/$REF^{}" "refs/tags/$REF" |
                  sort -k2 -r | head -1 | cut -f1)
          fi
          [ -n "$sha" ] || { echo "::error::cannot resolve '$REF' in $UPSTREAM"; exit 1; }

          prev=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null |
                 sed -n 's/^upstream-sha: *\([0-9a-f]*\).*/\1/p' | head -1 || true)

          echo "upstream $REF = $sha, last published = ${prev:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$prev" ] || [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/linux-weekly.yml/enable" || true

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner image => oldest glibc => widest compatibility.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            cmake texinfo libudev-dev patchelf curl git

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/scripts

      - name: Checkout upstream OpenOCD
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
          path: openocd
          fetch-depth: 0      # full history + tags for 'git describe'
          filter: blob:none

      - name: Cache dependency tarballs
        uses: actions/cache@v4
        with:
          path: work/downloads
          key: deps-${{ hashFiles('ci/.github/scripts/build-linux-bundle.sh') }}

      - name: Build
        run: ci/.github/scripts/build-linux-bundle.sh openocd work

      - uses: actions/upload-artifact@v4
        with:
          name: openocd-${{ matrix.arch }}-linux
          path: |
            work/openocd-*.tar.gz
            work/openocd-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release files
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          cd dist
          version=$(ls openocd-*-x86_64-linux.tar.gz | sed -E 's/^openocd-(.*)-x86_64-linux\.tar\.gz$/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Stable file names for the rolling release, so that
          #   .../releases/download/weekly/openocd-<arch>-linux.tar.gz
          # always points at the latest build.
          mkdir -p ../rolling
          for f in openocd-*-linux.tar.gz; do
            arch=$(echo "$f" | sed -E 's/.*-([^-]+)-linux\.tar\.gz$/\1/')
            cp "$f" "../rolling/openocd-$arch-linux.tar.gz"
            (cd ../rolling && sha256sum "openocd-$arch-linux.tar.gz" > "openocd-$arch-linux.tar.gz.sha256")
          done
          ls -l . ../rolling

          cat > ../notes.md <<NOTES
          Automated build of upstream OpenOCD \`$version\`
          ([$UPSTREAM@${SHA:0:12}](https://github.com/$UPSTREAM/commit/$SHA)), built $(date -u +%F).

          Self-contained bundles: libusb, hidapi, libftdi and libjaylink are shipped in \`lib/\`.
          Requires glibc >= 2.35 and libudev.

          \`\`\`sh
          tar xf openocd-$version-x86_64-linux.tar.gz
          ./openocd-*/bin/openocd -f interface/... -f target/...
          # USB permissions:
          sudo cp openocd-*/share/openocd/contrib/60-openocd.rules /etc/udev/rules.d/
          \`\`\`

          Permanent URL of this build:
          https://github.com/$GITHUB_REPOSITORY/releases/download/$version/openocd-$version-<arch>-linux.tar.gz

          upstream-sha: $SHA
          NOTES

      # One release per version, never deleted: stable URLs for deployment
      # tools that pin a version.
      - name: Publish '${{ env.VERSION }}' release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, keeping it."
            exit 0
          fi
          # Point the tag at the upstream commit when GitHub can resolve it in
          # this fork (shared fork network); fall back to this workflow's commit.
          # An existing tag (e.g. an upstream release tag) is reused as is.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$SHA" >/dev/null ||
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          fi
          # Untagged upstream snapshots are pre-releases; a real upstream
          # release (vX.Y.Z) becomes a normal release.
          if [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then kind=--latest; else kind="--prerelease --latest=false"; fi
          # shellcheck disable=SC2086
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag $kind \
            --title "OpenOCD $VERSION" --notes-file notes.md \
            dist/openocd-*.tar.gz dist/openocd-*.tar.gz.sha256

      - name: Publish '${{ env.RELEASE_TAG }}' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "OpenOCD weekly $VERSION" --notes-file notes.md \
            dist/openocd-*.tar.gz dist/openocd-*.tar.gz.sha256 \
            rolling/openocd-*.tar.gz rolling/openocd-*.tar.gz.sha256
